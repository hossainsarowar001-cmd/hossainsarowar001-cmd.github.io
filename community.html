<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Q&A | Anima Clip</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
        }
        .header p {
            color: var(--text-muted);
            margin: 0;
        }
        .nav-links {
            text-align: center;
            margin-bottom: 20px;
        }
        .nav-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }
        .input-group {
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .btn-danger {
            background-color: var(--danger);
            padding: 6px 12px;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .btn-reply {
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 12px;
            font-size: 0.85rem;
            margin-top: 10px;
            margin-right: 10px;
        }
        .question-card {
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .author {
            font-weight: bold;
            color: var(--accent);
        }
        .reply-card {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            margin-left: 20px;
            border-left: 3px solid var(--accent);
        }
        .loading-banner {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>AnimaClip Community</h1>
        <p>Ask questions, share tips, and help fellow developers!</p>
    </div>

    <div class="nav-links">
        <a href="contact.html">← Back to Contact Support</a>
    </div>

    <div class="input-group">
        <input type="text" id="qAuthor" placeholder="Your Name (e.g., John Doe)">
        <textarea id="qText" placeholder="What's your question?"></textarea>
        <button onclick="submitQuestion()">Post Question</button>
    </div>

    <div id="questionsContainer">
        <div class="loading-banner">Syncing with live database...</div>
    </div>
</div>

<script>
    // FULLY AUTHORIZED BACKEND URL
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9wElcmo2rtZp1IclXXmOdkl56t5DQQ4uMq3DlLboxQ7nWtwI70NZt_MZXZC0Yzluz1A/exec';
    
    const STORAGE_KEY = 'animaclip_cache_questions';
    const USER_ID_KEY = 'animaclip_device_user_id';
    
    // Developer Credentials
    const SECRET_PIN = '@Mohd834875';
    const OFFICIAL_EMAIL = 'incriblestudiodeveloper@gmail.com';

    let questionsData = [];

    // Anonymous Device Identity
    function getCurrentUserId() {
        let uid = localStorage.getItem(USER_ID_KEY);
        if (!uid) {
            uid = 'user_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
            localStorage.setItem(USER_ID_KEY, uid);
        }
        return uid;
    }

    const currentUserId = getCurrentUserId();

    // Cross-Origin Script Injection Callback (Reads DB)
    window.onQuestionsLoaded = function(data) {
        if (Array.isArray(data)) {
            questionsData = data.filter(q => q.authorId !== "system_mod" && q.id !== "");
            localStorage.setItem(STORAGE_KEY, JSON.stringify(questionsData));
            renderQuestions();
        }
    };

    // Fetch live data directly from Google Sheets
    function loadOnlineQuestions() {
        const cached = localStorage.getItem(STORAGE_KEY);
        if (cached) {
            try {
                questionsData = JSON.parse(cached).filter(q => q.authorId !== "system_mod" && q.id !== "") || [];
                renderQuestions();
            } catch (e) {
                questionsData = [];
            }
        }

        const script = document.createElement('script');
        script.src = SCRIPT_URL + '?callback=onQuestionsLoaded&t=' + Date.now();
        
        script.onload = function() {
            document.body.removeChild(script);
        };
        
        document.body.appendChild(script);
    }

    // Push data to Google Sheets
    function syncToDatabase() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(questionsData));
        const encodedData = encodeURIComponent(JSON.stringify(questionsData));
        
        const script = document.createElement('script');
        script.src = SCRIPT_URL + '?action=save_community&data=' + encodedData + '&t=' + Date.now();
        
        script.onload = function() {
            document.body.removeChild(script);
        };
        
        document.body.appendChild(script);
    }

    // Submit a new question
    function submitQuestion() {
        const authorInput = document.getElementById('qAuthor');
        const textInput = document.getElementById('qText');
        
        let author = authorInput.value.trim();
        const text = textInput.value.trim();

        if (!text) {
            alert("Please enter a question.");
            return;
        }

        let isDeveloper = false;
        if (author === SECRET_PIN) {
            author = "Incrible Studio Developer";
            isDeveloper = true;
        } else if (!author) {
            author = "Anonymous Developer";
        }

        const newQuestion = {
            id: 'q_' + Date.now(),
            author: author,
            text: text,
            date: new Date().toLocaleDateString(),
            authorId: isDeveloper ? OFFICIAL_EMAIL : currentUserId,
            replies: []
        };

        questionsData.unshift(newQuestion);
        textInput.value = '';
        if (!isDeveloper) authorInput.value = '';
        
        renderQuestions();
        syncToDatabase();
    }

    // Submit a reply
    function submitReply(questionId) {
        const replyText = prompt("Type your reply:");
        if (!replyText) return;

        let authorName = prompt("Your Name (Leave blank for Anonymous):") || "Anonymous Developer";
        let isDeveloper = false;
        
        if (authorName === SECRET_PIN) {
            authorName = "Incrible Studio Developer";
            isDeveloper = true;
        }

        const question = questionsData.find(q => q.id === questionId);
        if (question) {
            if (!question.replies) question.replies = [];
            question.replies.push({
                id: 'r_' + Date.now(),
                author: authorName,
                text: replyText,
                date: new Date().toLocaleDateString(),
                authorId: isDeveloper ? OFFICIAL_EMAIL : currentUserId
            });
            
            renderQuestions();
            syncToDatabase();
        }
    }

    // Delete a post or reply (Requires Ownership or Developer PIN)
    function deleteItem(questionId, replyId = null) {
        let authAttempt = prompt("To delete this post, confirm you are the owner. \nIf you are the developer, enter your PIN. \nOtherwise, leave blank and press OK to verify device ownership:");
        
        const isDev = (authAttempt === SECRET_PIN);

        if (replyId) {
            const q = questionsData.find(q => q.id === questionId);
            const rIndex = q.replies.findIndex(r => r.id === replyId);
            
            if (isDev || q.replies[rIndex].authorId === currentUserId) {
                if (confirm("Permanently delete this reply?")) {
                    q.replies.splice(rIndex, 1);
                    renderQuestions();
                    syncToDatabase();
                }
            } else {
                alert("Permission denied. You did not create this reply.");
            }
        } else {
            const qIndex = questionsData.findIndex(q => q.id === questionId);
            
            if (isDev || questionsData[qIndex].authorId === currentUserId) {
                if (confirm("Permanently delete this question and all its replies?")) {
                    questionsData.splice(qIndex, 1);
                    renderQuestions();
                    syncToDatabase();
                }
            } else {
                alert("Permission denied. You did not create this question.");
            }
        }
    }

    // Render HTML
    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';

        if (questionsData.length === 0) {
            container.innerHTML = '<div class="loading-banner">No questions yet. Be the first to ask!</div>';
            return;
        }

        questionsData.forEach(q => {
            const devBadgeQ = q.authorId === OFFICIAL_EMAIL ? ' <span style="background:var(--accent);color:white;padding:2px 6px;border-radius:4px;font-size:0.7rem;margin-left:5px;">DEV</span>' : '';
            
            let html = `
                <div class="question-card" id="${q.id}">
                    <div class="meta">
                        <span><span class="author">${q.author}</span>${devBadgeQ}</span>
                        <span>${q.date}</span>
                    </div>
                    <div class="text">${q.text}</div>
                    <button class="btn-reply" onclick="submitReply('${q.id}')">Reply</button>
                    <button class="btn-danger" onclick="deleteItem('${q.id}')">Delete</button>
            `;

            if (q.replies && q.replies.length > 0) {
                q.replies.forEach(r => {
                    const devBadgeR = r.authorId === OFFICIAL_EMAIL ? ' <span style="background:var(--accent);color:white;padding:2px 6px;border-radius:4px;font-size:0.7rem;margin-left:5px;">DEV</span>' : '';
                    html += `
                        <div class="reply-card" id="${r.id}">
                            <div class="meta">
                                <span><span class="author">↳ ${r.author}</span>${devBadgeR}</span>
                                <span>${r.date}</span>
                            </div>
                            <div class="text">${r.text}</div>
                            <button class="btn-danger" style="margin-top:10px;" onclick="deleteItem('${q.id}', '${r.id}')">Delete Reply</button>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            container.innerHTML += html;
        });
    }

    // Initialize on load
    loadOnlineQuestions();
</script>

</body>
</html>
