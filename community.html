<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Q&A - Anima Clip</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 24px 16px;
      color: #333;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      max-width: 640px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      color: #1a73e8;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .question-box {
      border: 1px solid #dcdfe6;
      border-radius: 10px;
      padding: 20px;
      background: #fafbfc;
      margin-bottom: 28px;
    }
    .question-box h3 {
      margin-top: 0;
      font-size: 16px;
      color: #202124;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 10px;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-primary {
      background-color: #1a73e8;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #1557b0;
    }
    .btn-danger {
      background-color: transparent;
      color: #d93025;
      font-size: 12px;
      padding: 4px 8px;
      border: 1px solid #f5c2c7;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-danger:hover {
      background-color: #fde8e8;
    }
    .btn-secondary {
      background-color: #e8f0fe;
      color: #1a73e8;
      font-size: 13px;
      padding: 6px 12px;
    }
    .btn-secondary:hover {
      background-color: #d2e3fc;
    }
    .feed-title {
      font-size: 18px;
      margin-bottom: 16px;
      color: #202124;
      border-bottom: 2px solid #eee;
      padding-bottom: 8px;
    }
    .question-card {
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
      background: #fff;
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .author-name {
      font-weight: 600;
      font-size: 14px;
      color: #1a73e8;
    }
    .date-tag {
      font-size: 12px;
      color: #888;
      margin-left: 8px;
    }
    .question-text {
      font-size: 15px;
      color: #222;
      line-height: 1.5;
      margin: 8px 0 14px;
    }
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid #f1f3f4;
    }
    .replies-list {
      margin-top: 14px;
      padding-left: 16px;
      border-left: 3px solid #1a73e8;
    }
    .reply-item {
      background: #f8f9fa;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13.5px;
    }
    .reply-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #444;
      margin-bottom: 4px;
    }
    .developer-tag {
      background: #1a73e8;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
    }
    .answer-form {
      display: none;
      margin-top: 12px;
      padding: 14px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .nav-links {
      text-align: center;
      margin-top: 24px;
    }
    .nav-links a {
      color: #1a73e8;
      text-decoration: none;
      font-size: 14px;
      margin: 0 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Community Q&A</h2>
    <p class="subtitle">Ask your questions here and our community or developer will help you!</p>

    <!-- Post Question Form -->
    <div class="question-box">
      <h3>Add your question here</h3>
      <input type="text" id="qAuthor" placeholder="Your Name or Nickname" required>
      <textarea id="qText" placeholder="Write your question or query here..." required></textarea>
      <button class="btn btn-primary" onclick="submitQuestion()">Post Question</button>
    </div>

    <!-- Questions Feed -->
    <div class="feed-title">Questions & Discussion</div>
    <div id="questionsContainer"></div>

    <div class="nav-links">
      <a href="contact.html">← Back to Contact Support</a>
      <a href="index.html">Home</a>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'animaclip_community_questions';
    const USER_ID_KEY = 'animaclip_device_user_id';
    const DEV_SECRET_PIN = '@Mohd834875';

    function getCurrentUserId() {
      let uid = localStorage.getItem(USER_ID_KEY);
      if (!uid) {
        uid = 'user_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
        localStorage.setItem(USER_ID_KEY, uid);
      }
      return uid;
    }

    const currentUserId = getCurrentUserId();

    function getQuestions() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) {
        const defaults = [
          {
            id: 1,
            authorId: "system_mod",
            author: "Community Mod",
            date: "Recent",
            text: "Welcome to the Anima Clip Q&A board! Feel free to ask anything about features, updates, or troubleshooting.",
            replies: [
              { id: 101, authorId: "system_dev", author: "Hossain Sarowar", isDev: true, date: "Recent", text: "We check here frequently to help answer any questions!" }
            ]
          }
        ];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaults));
        return defaults;
      }
      return JSON.parse(stored);
    }

    function saveQuestions(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      renderQuestions();
    }

    function submitQuestion() {
      const authorInput = document.getElementById('qAuthor');
      const textInput = document.getElementById('qText');
      const author = authorInput.value.trim();
      const text = textInput.value.trim();

      if (!author || !text) {
        alert("Please enter both your name and your question.");
        return;
      }

      if (author.toLowerCase().includes("developer") || author.toLowerCase().includes("mod")) {
        alert("Names containing 'Developer' or 'Mod' are restricted.");
        return;
      }

      const questions = getQuestions();
      const newQuestion = {
        id: Date.now(),
        authorId: currentUserId,
        author: author,
        date: new Date().toLocaleDateString(),
        text: text,
        replies: []
      };

      questions.unshift(newQuestion);
      saveQuestions(questions);

      authorInput.value = '';
      textInput.value = '';
    }

    function deleteQuestion(id) {
      const questions = getQuestions();
      const q = questions.find(item => item.id === id);

      if (!q || q.authorId !== currentUserId) {
        alert("Action not permitted: You can only delete your own questions.");
        return;
      }

      const confirmDelete = confirm("⚠️ Warning: Are you sure you want to delete this question? This action cannot be undone.");
      if (confirmDelete) {
        const updated = questions.filter(item => item.id !== id);
        saveQuestions(updated);
      }
    }

    function deleteReply(qId, rId) {
      const questions = getQuestions();
      const question = questions.find(item => item.id === qId);

      if (question) {
        const reply = question.replies.find(r => r.id === rId);
        if (!reply || reply.authorId !== currentUserId) {
          alert("Action not permitted: You can only delete your own replies.");
          return;
        }

        const confirmDelete = confirm("⚠️ Warning: Are you sure you want to delete this reply?");
        if (confirmDelete) {
          question.replies = question.replies.filter(r => r.id !== rId);
          saveQuestions(questions);
        }
      }
    }

    function toggleAnswerBox(id) {
      const box = document.getElementById(`answer-form-${id}`);
      box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function submitAnswer(qId) {
      const authorInput = document.getElementById(`replyAuthor-${qId}`);
      const passInput = document.getElementById(`devPass-${qId}`);
      const textInput = document.getElementById(`replyText-${qId}`);

      const author = authorInput.value.trim();
      const passcode = passInput.value.trim();
      const text = textInput.value.trim();

      if (!author || !text) {
        alert("Please provide your name and an answer.");
        return;
      }

      const isDev = (passcode === DEV_SECRET_PIN);

      if (!isDev && (author.toLowerCase().includes("developer") || author.toLowerCase().includes("sarowar"))) {
        alert("The developer identity is protected. Enter the correct Developer Passcode or choose another name.");
        return;
      }

      const questions = getQuestions();
      const question = questions.find(q => q.id === qId);

      if (question) {
        question.replies.push({
          id: Date.now(),
          authorId: currentUserId,
          author: author,
          isDev: isDev,
          date: new Date().toLocaleDateString(),
          text: text
        });
        saveQuestions(questions);
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      const questions = getQuestions();

      if (questions.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #777;">No questions yet. Be the first to ask!</p>';
        return;
      }

      container.innerHTML = questions.map(q => {
        const isQuestionOwner = q.authorId === currentUserId;

        return `
          <div class="question-card">
            <div class="question-header">
              <div>
                <span class="author-name">${q.author}</span>
                <span class="date-tag">${q.date}</span>
              </div>
              ${isQuestionOwner ? `<button class="btn btn-danger" onclick="deleteQuestion(${q.id})">Delete</button>` : ''}
            </div>
            <div class="question-text">${q.text}</div>

            <div class="actions-bar">
              <button class="btn btn-secondary" onclick="toggleAnswerBox(${q.id})">💬 Answer / Reply</button>
              <span style="font-size: 12px; color: #777;">${q.replies.length} ${q.replies.length === 1 ? 'Answer' : 'Answers'}</span>
            </div>

            <!-- Answer Input Form -->
            <div id="answer-form-${q.id}" class="answer-form">
              <input type="text" id="replyAuthor-${q.id}" placeholder="Your Name">
              <input type="password" id="devPass-${q.id}" placeholder="Developer PIN (Optional - leave blank if community user)">
              <textarea id="replyText-${q.id}" placeholder="Write your reply or answer here..."></textarea>
              <button class="btn btn-primary" style="padding: 6px 14px; font-size: 13px;" onclick="submitAnswer(${q.id})">Post Answer</button>
            </div>

            <!-- Replies List -->
            ${q.replies.length > 0 ? `
              <div class="replies-list">
                ${q.replies.map(r => {
                  const isReplyOwner = r.authorId === currentUserId;
                  return `
                    <div class="reply-item">
                      <div class="reply-meta">
                        <div>
                          ${r.author} ${r.isDev ? '<span class="developer-tag">Developer</span>' : ''}
                          <span class="date-tag">${r.date}</span>
                        </div>
                        ${isReplyOwner ? `<button class="btn btn-danger" onclick="deleteReply(${q.id},${r.id})">Delete</button>` : ''}
                      </div>
                      <div>${r.text}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    renderQuestions();
  </script>

</body>
</html>
