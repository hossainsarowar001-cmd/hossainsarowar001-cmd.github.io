<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Q&A - Anima Clip</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 24px 16px;
      color: #333;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      max-width: 680px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      color: #1a73e8;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .question-box {
      border: 1px solid #dcdfe6;
      border-radius: 10px;
      padding: 20px;
      background: #fafbfc;
      margin-bottom: 28px;
    }
    .question-box h3 {
      margin-top: 0;
      font-size: 16px;
      color: #202124;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 10px;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-primary {
      background-color: #1a73e8;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #1557b0;
    }
    .btn-danger {
      background-color: transparent;
      color: #d93025;
      font-size: 12px;
      padding: 3px 8px;
      border: 1px solid #f5c2c7;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-danger:hover {
      background-color: #fde8e8;
    }
    .btn-secondary {
      background-color: #e8f0fe;
      color: #1a73e8;
      font-size: 13px;
      padding: 7px 12px;
    }
    .btn-secondary:hover {
      background-color: #d2e3fc;
    }
    .btn-dev-trigger {
      background-color: #f1f3f4;
      color: #3c4043;
      font-size: 12px;
      padding: 7px 10px;
    }
    .btn-dev-trigger:hover {
      background-color: #e8eaed;
    }
    .feed-title {
      font-size: 18px;
      margin-bottom: 16px;
      color: #202124;
      border-bottom: 2px solid #eee;
      padding-bottom: 8px;
    }
    .question-card {
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      background: #fff;
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .author-name {
      font-weight: 600;
      font-size: 14px;
      color: #1a73e8;
    }
    .date-tag {
      font-size: 12px;
      color: #888;
      margin-left: 8px;
    }
    .question-text {
      font-size: 15px;
      color: #222;
      line-height: 1.5;
      margin: 8px 0 16px;
    }
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid #f1f3f4;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Response Sections */
    .section-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-label.dev {
      color: #1a73e8;
    }
    .section-label.community {
      color: #5f6368;
    }

    /* Official Developer Card */
    .dev-response-card {
      background: #f8fbff;
      border: 1.5px solid #c2e7ff;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .dev-badge {
      background-color: #1a73e8;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Community User Card */
    .community-response-card {
      background: #fafbfc;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .reply-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    /* Forms */
    .answer-form {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 8px;
    }
    .form-user {
      background: #f8f9fa;
      border: 1px solid #dadce0;
    }
    .form-developer {
      background: #f0f7ff;
      border: 1.5px solid #1a73e8;
    }
    .dev-auth-row {
      display: flex;
      gap: 8px;
    }
    .dev-auth-row input {
      flex: 1;
    }

    .nav-links {
      text-align: center;
      margin-top: 24px;
    }
    .nav-links a {
      color: #1a73e8;
      text-decoration: none;
      font-size: 14px;
      margin: 0 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Community Q&A</h2>
    <p class="subtitle">Ask your questions here and get answers from Incrible Studio or other community members!</p>

    <!-- Post Question Form -->
    <div class="question-box">
      <h3>Ask a Question</h3>
      <input type="text" id="qAuthor" placeholder="Your Name or Nickname" required>
      <textarea id="qText" placeholder="Describe your question or issue in detail..." required></textarea>
      <button class="btn btn-primary" onclick="submitQuestion()">Post Question</button>
    </div>

    <!-- Questions Feed -->
    <div class="feed-title">Questions & Discussions</div>
    <div id="questionsContainer"></div>

    <div class="nav-links">
      <a href="contact.html">← Back to Contact Support</a>
      <a href="index.html">Home</a>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'animaclip_community_questions';
    const USER_ID_KEY = 'animaclip_device_user_id';
    
    // Developer Secret Credentials
    const DEV_SECRET_PIN = '@Mohd834875';
    const DEV_OFFICIAL_EMAIL = 'incriblestudiodeveloper@gmail.com';

    function getCurrentUserId() {
      let uid = localStorage.getItem(USER_ID_KEY);
      if (!uid) {
        uid = 'user_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
        localStorage.setItem(USER_ID_KEY, uid);
      }
      return uid;
    }

    const currentUserId = getCurrentUserId();

    function getQuestions() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) {
        const defaults = [
          {
            id: 1,
            authorId: "system_welcome",
            author: "Community Mod",
            date: "Official",
            text: "Welcome to the Anima Clip Q&A board! Have a question about tools, updates, or ad readiness? Post your query here.",
            replies: [
              { 
                id: 101, 
                authorId: "system_dev", 
                author: "Incrible Studio", 
                isDev: true, 
                date: "Official", 
                text: "Welcome! Our team monitors this board to answer developer, app, and support questions directly." 
              }
            ]
          }
        ];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(defaults));
        return defaults;
      }
      return JSON.parse(stored);
    }

    function saveQuestions(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      renderQuestions();
    }

    function submitQuestion() {
      const authorInput = document.getElementById('qAuthor');
      const textInput = document.getElementById('qText');
      const author = authorInput.value.trim();
      const text = textInput.value.trim();

      if (!author || !text) {
        alert("Please enter both your name and your question.");
        return;
      }

      if (author.toLowerCase().includes("developer") || author.toLowerCase().includes("mod") || author.toLowerCase().includes("incrible")) {
        alert("Names containing 'Developer', 'Mod', or 'Incrible' are reserved.");
        return;
      }

      const questions = getQuestions();
      const newQuestion = {
        id: Date.now(),
        authorId: currentUserId,
        author: author,
        date: new Date().toLocaleDateString(),
        text: text,
        replies: []
      };

      questions.unshift(newQuestion);
      saveQuestions(questions);

      authorInput.value = '';
      textInput.value = '';
    }

    function deleteQuestion(id) {
      const questions = getQuestions();
      const q = questions.find(item => item.id === id);

      if (!q || q.authorId !== currentUserId) {
        alert("Action not permitted: You can only delete your own questions.");
        return;
      }

      if (confirm("⚠️ Warning: Are you sure you want to delete this question?")) {
        saveQuestions(questions.filter(item => item.id !== id));
      }
    }

    function deleteReply(qId, rId) {
      const questions = getQuestions();
      const question = questions.find(item => item.id === qId);

      if (question) {
        const reply = question.replies.find(r => r.id === rId);
        if (!reply || reply.authorId !== currentUserId) {
          alert("Action not permitted: You can only delete your own replies.");
          return;
        }

        if (confirm("⚠️ Warning: Are you sure you want to delete this reply?")) {
          question.replies = question.replies.filter(r => r.id !== rId);
          saveQuestions(questions);
        }
      }
    }

    function toggleForm(id, type) {
      const userForm = document.getElementById(`user-form-${id}`);
      const devForm = document.getElementById(`dev-form-${id}`);

      if (type === 'user') {
        devForm.style.display = 'none';
        userForm.style.display = (userForm.style.display === 'block') ? 'none' : 'block';
      } else {
        userForm.style.display = 'none';
        devForm.style.display = (devForm.style.display === 'block') ? 'none' : 'block';
      }
    }

    function submitUserReply(qId) {
      const author = document.getElementById(`replyAuthor-${qId}`).value.trim();
      const text = document.getElementById(`replyText-${qId}`).value.trim();

      if (!author || !text) {
        alert("Please enter both your name and reply.");
        return;
      }

      if (author.toLowerCase().includes("developer") || author.toLowerCase().includes("incrible")) {
        alert("Names containing 'Developer' or 'Incrible' are reserved. Use the Developer Portal to post as official staff.");
        return;
      }

      const questions = getQuestions();
      const question = questions.find(q => q.id === qId);
      if (question) {
        question.replies.push({
          id: Date.now(),
          authorId: currentUserId,
          author: author,
          isDev: false,
          date: new Date().toLocaleDateString(),
          text: text
        });
        saveQuestions(questions);
      }
    }

    function submitDevReply(qId) {
      const email = document.getElementById(`devEmail-${qId}`).value.trim().toLowerCase();
      const pin = document.getElementById(`devPass-${qId}`).value.trim();
      const text = document.getElementById(`devText-${qId}`).value.trim();

      if (!email || !pin || !text) {
        alert("Please fill in Developer Email, Secret PIN, and your response message.");
        return;
      }

      if (email !== DEV_OFFICIAL_EMAIL || pin !== DEV_SECRET_PIN) {
        alert("❌ Authentication Failed: Developer email or secret PIN does not match.");
        return;
      }

      const questions = getQuestions();
      const question = questions.find(q => q.id === qId);
      if (question) {
        question.replies.push({
          id: Date.now(),
          authorId: currentUserId,
          author: "Incrible Studio",
          isDev: true,
          date: new Date().toLocaleDateString(),
          text: text
        });
        saveQuestions(questions);
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      const questions = getQuestions();

      if (questions.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #777;">No questions yet. Be the first to ask!</p>';
        return;
      }

      container.innerHTML = questions.map(q => {
        const isQuestionOwner = q.authorId === currentUserId;

        // Segregate replies
        const devReplies = q.replies.filter(r => r.isDev);
        const userReplies = q.replies.filter(r => !r.isDev);

        return `
          <div class="question-card">
            <!-- Question Content -->
            <div class="question-header">
              <div>
                <span class="author-name">${q.author}</span>
                <span class="date-tag">${q.date}</span>
              </div>
              ${isQuestionOwner ? `<button class="btn btn-danger" onclick="deleteQuestion(${q.id})">Delete</button>` : ''}
            </div>
            <div class="question-text">${q.text}</div>

            <!-- Action Buttons -->
            <div class="actions-bar">
              <div style="display: flex; gap: 8px;">
                <button class="btn btn-secondary" onclick="toggleForm(${q.id}, 'user')">💬 Reply as User</button>
                <button class="btn btn-dev-trigger" onclick="toggleForm(${q.id}, 'dev')">🛡️ Developer Portal</button>
              </div>
              <span style="font-size: 12px; color: #777;">${q.replies.length} Total Replies</span>
            </div>

            <!-- Normal User Form -->
            <div id="user-form-${q.id}" class="answer-form form-user">
              <div style="font-weight: 600; font-size: 13px; margin-bottom: 8px; color: #333;">Post Community Reply</div>
              <input type="text" id="replyAuthor-${q.id}" placeholder="Your Name or Nickname">
              <textarea id="replyText-${q.id}" placeholder="Write your reply or advice..."></textarea>
              <button class="btn btn-primary" style="padding: 6px 14px; font-size: 13px;" onclick="submitUserReply(${q.id})">Post User Reply</button>
            </div>

            <!-- Dedicated Developer Authentication Form -->
            <div id="dev-form-${q.id}" class="answer-form form-developer">
              <div style="font-weight: 700; font-size: 13px; margin-bottom: 8px; color: #1a73e8;">🛡️ Official Incrible Studio Response</div>
              <div class="dev-auth-row">
                <input type="email" id="devEmail-${q.id}" placeholder="incriblestudiodeveloper@gmail.com">
                <input type="password" id="devPass-${q.id}" placeholder="Developer Secret PIN">
              </div>
              <textarea id="devText-${q.id}" placeholder="Write official developer response..."></textarea>
              <button class="btn btn-primary" style="padding: 6px 14px; font-size: 13px; background-color: #1a73e8;" onclick="submitDevReply(${q.id})">Publish Official Answer</button>
            </div>

            <!-- SECTION 1: Developer Answers -->
            ${devReplies.length > 0 ? `
              <div class="section-label dev">🛡️ Official Developer Response (${devReplies.length})</div>${devReplies.map(r => {
                const isReplyOwner = r.authorId === currentUserId;
                return `
                  <div class="dev-response-card">
                    <div class="reply-meta">
                      <div>
                        <span style="color: #1a73e8;">${r.author}</span>
                        <span class="dev-badge">✓ Official Developer</span>
                        <span class="date-tag">${r.date}</span>
                      </div>
                      ${isReplyOwner ? `<button class="btn btn-danger" onclick="deleteReply(${q.id},${r.id})">Delete</button>` : ''}
                    </div>
                    <div style="font-size: 14px; color: #1f1f1f; line-height: 1.45;">${r.text}</div>
                  </div>
                `;
              }).join('')}
            ` : ''}

            <!-- SECTION 2: Community Replies -->
            ${userReplies.length > 0 ? `
              <div class="section-label community">👥 Community Discussion (${userReplies.length})</div>${userReplies.map(r => {
                const isReplyOwner = r.authorId === currentUserId;
                return `
                  <div class="community-response-card">
                    <div class="reply-meta">
                      <div>
                        <span>${r.author}</span>
                        <span class="date-tag">${r.date}</span>
                      </div>
                      ${isReplyOwner ? `<button class="btn btn-danger" onclick="deleteReply(${q.id},${r.id})">Delete</button>` : ''}
                    </div>
                    <div style="font-size: 13.5px; color: #444; line-height: 1.4;">${r.text}</div>
                  </div>
                `;
              }).join('')}
            ` : ''}

          </div>
        `;
      }).join('');
    }

    renderQuestions();
  </script>

</body>
</html>
