<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anima Clip - Support & Developer Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 38px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #1a73e8;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: #64748b;
      font-size: 14.5px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .btn {
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    /* Compact Oval / Egg Button */
    .btn-primary {
      display: inline-block;
      width: auto;
      padding: 10px 28px;
      font-size: 14px;
      background-color: #1a73e8;
      color: #ffffff;
      border-radius: 9999px;
      box-shadow: 0 2px 8px rgba(26, 115, 232, 0.25);
    }
    .btn-primary:hover {
      background-color: #1557b0;
    }
    /* Secondary Grey Button */
    .btn-grey {
      display: inline-block;
      width: auto;
      padding: 8px 18px;
      font-size: 13px;
      background-color: #f1f3f5;
      color: #495057;
      border: 1px solid #ced4da;
      border-radius: 8px;
    }
    .btn-grey:hover {
      background-color: #e9ecef;
      color: #212529;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Anima Clip</h1>
    <p>Welcome to the official developer support page for Anima Clip.</p>

    <div class="btn-group">
      <a href="contact.html" class="btn btn-primary">Contact Us</a>
      <a href="/app-ads.txt" class="btn btn-grey">Verify app-ads.txt</a>
    </div>
  </div>

</body>
</html>
