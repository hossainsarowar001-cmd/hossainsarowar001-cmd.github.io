<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anima Clip</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f6f8;
      color: #333;
    }
    .container {
      text-align: center;
      background: #ffffff;
      padding: 36px 28px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 90%;
    }
    h1 {
      margin-top: 0;
      font-size: 26px;
      color: #1a73e8;
    }
    p {
      font-size: 15px;
      color: #555;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background-color: #1a73e8;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #1557b0;
    }
    .app-ads-link {
      display: block;
      margin-top: 20px;
      font-size: 13px;
      color: #777;
      text-decoration: none;
    }
    .app-ads-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Anima Clip</h1>
    <p>Welcome to the official developer support page for Anima Clip.</p>
    <a href="contact.html" class="btn">Contact Us</a>
    <a href="app-ads.txt" class="app-ads-link">Verify app-ads.txt</a>
  </div>
</body>
</html>
