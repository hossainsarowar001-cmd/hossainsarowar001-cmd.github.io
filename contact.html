<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support - Anima Clip</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 24px 16px;
      color: #333;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      max-width: 600px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      color: #1a73e8;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #444;
    }
    input, textarea {
      width: 100%;
      padding: 11px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-submit:disabled {
      background-color: #9ac1f6;
    }
    .status-alert {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }
    .status-alert.success {
      background-color: #e6f4ea;
      color: #137333;
    }
    .status-alert.error {
      background-color: #fde8e8;
      color: #c5221f;
    }
    .nav-links {
      text-align: center;
      margin-top: 24px;
    }
    .nav-links a {
      color: #1a73e8;
      text-decoration: none;
      font-size: 14px;
      margin: 0 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Contact Support</h2>
    <p class="subtitle">Have questions or found a bug? Send a message to Incrible Studio.</p>

    <form id="contactForm">
      <div class="form-group">
        <label for="userName">Your Name</label>
        <input type="text" id="userName" placeholder="e.g. Alex" required>
      </div>

      <div class="form-group">
        <label for="userEmail">Your Email Address</label>
        <input type="email" id="userEmail" placeholder="e.g. alex@example.com" required>
      </div>

      <div class="form-group">
        <label for="ticketSubject">Subject (Optional)</label>
        <input type="text" id="ticketSubject" placeholder="e.g. Export issue on Layer 3">
      </div>

      <div class="form-group">
        <label for="ticketMessage">Message</label>
        <textarea id="ticketMessage" placeholder="Describe what you need help with..." required></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmitTicket">Send Message</button>
    </form>

    <div id="contactStatus" class="status-alert"></div>

    <div class="nav-links">
      <a href="community.html">Go to Community Q&A →</a>
      <a href="index.html">Home</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const DEV_NOTIFICATION_EMAIL = "Incriblestudiodeveloper@gmail.com";

    const firebaseConfig = {
      apiKey: "AIzaSyDzQo1HsYJwdcwOJFo2xd8P347PXgw3COE",
      authDomain: "anima-clip-support.firebaseapp.com",
      projectId: "anima-clip-support",
      storageBucket: "anima-clip-support.firebasestorage.app",
      messagingSenderId: "998194247470",
      appId: "1:998194247470:web:9bfb771ce9356dcf3d2597",
      measurementId: "G-7QKLY9KODR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const contactForm = document.getElementById('contactForm');
    const btn = document.getElementById('btnSubmitTicket');
    const statusBox = document.getElementById('contactStatus');

    contactForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerText = 'Sending...';

      const name = document.getElementById('userName').value.trim();
      const email = document.getElementById('userEmail').value.trim();
      const subject = document.getElementById('ticketSubject').value.trim() || 'New Support Request';
      const message = document.getElementById('ticketMessage').value.trim();

      try {
        await fetch(`https://formsubmit.co/ajax/${DEV_NOTIFICATION_EMAIL}`, {
          method: "POST",
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            name: name,
            email: email,
            _subject: `[Anima Clip Support] ${subject}`,
            message: message
          })
        });

        await addDoc(collection(db, "contact_submissions"), {
          name,
          email,
          subject,
          message,
          createdAt: serverTimestamp()
        });

        contactForm.reset();
        statusBox.className = 'status-alert success';
        statusBox.innerText = '✓ Message sent! Developer will review and email you back.';
        statusBox.style.display = 'block';
      } catch (err) {
        statusBox.className = 'status-alert error';
        statusBox.innerText = '⚠️ Failed to send message. Please try again.';
        statusBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Send Message';
      }
    });
  </script>
</body>
</html>
