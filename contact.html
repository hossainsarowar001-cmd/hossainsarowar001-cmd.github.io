<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Support - Anima Clip</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 24px 16px;
      color: #333;
      display: flex;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      max-width: 640px;
      width: 100%;
    }
    h2 {
      margin-top: 0;
      color: #1a73e8;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .notification {
      display: none;
      background-color: #e6f4ea;
      color: #137333;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      border: 1px solid #ceead6;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #202124;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    .btn {
      width: 100%;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #1a73e8;
      color: #ffffff;
      margin-top: 8px;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .nav-links {
      text-align: center;
      margin-top: 24px;
    }
    .nav-links a {
      color: #1a73e8;
      text-decoration: none;
      font-size: 14px;
      margin: 0 10px;
    }

    /* Cute Floating Bot Action Button */
    .ai-fab-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      border-radius: 50%;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    }
    .ai-fab-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.55);
    }
    .ai-fab-btn svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    /* Floating Chat Popup Window */
    .ai-chat-window {
      display: none;
      position: fixed;
      bottom: 88px;
      right: 24px;
      width: 340px;
      max-width: calc(100vw - 32px);
      height: 460px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      z-index: 1000;
      flex-direction: column;
      overflow: hidden;
    }
    .ai-chat-header {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ai-chat-close {
      background: transparent;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .ai-chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f8fafc;
      font-size: 13.5px;
    }
    .chat-bubble {
      padding: 9px 13px;
      border-radius: 10px;
      line-height: 1.45;
      max-width: 82%;
      word-break: break-word;
      white-space: pre-line;
    }
    .chat-bubble.bot {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      align-self: flex-start;
      color: #1e293b;
    }
    .chat-bubble.user {
      background: #4f46e5;
      color: #ffffff;
      align-self: flex-end;
    }
    .chat-bubble.loading {
      font-style: italic;
      color: #888;
      background: #f1f5f9;
      align-self: flex-start;
    }
    .ai-chat-footer {
      display: flex;
      padding: 10px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      gap: 8px;
    }
    .ai-chat-input {
      flex: 1;
      margin-bottom: 0;
      padding: 8px 12px;
      font-size: 13.5px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
    }
    .ai-chat-send {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Contact Support</h2>
    <p class="subtitle">Have a private issue or bug to report? Send a message directly to the Incrible Studio developer team.</p>

    <div id="contactNotification" class="notification"></div>

    <form id="contactForm">
      <div class="form-group">
        <label for="contactEmail">Your Email Address</label>
        <input type="email" id="contactEmail" placeholder="e.g. yourname@gmail.com" required maxlength="100">
      </div>

      <div class="form-group">
        <label for="contactMessage">Message or Bug Description</label>
        <textarea id="contactMessage" placeholder="Describe the issue you encountered..." required maxlength="3000"></textarea>
      </div>

      <button type="submit" class="btn" id="btnSubmitContact">Send Message</button>
    </form>

    <div class="nav-links">
      <a href="community.html">Go to Community Q&A</a>
      <a href="index.html">Home</a>
    </div>
  </div>

  <!-- Cute Floating Bot Action Button -->
  <button class="ai-fab-btn" id="aiChatToggle" title="Chat with Anima Clip Assistant" aria-label="Open AI Assistant">
    <svg viewBox="0 0 24 24">
      <path d="M12 2a1 1 0 0 1 1 1v1.07C16.83 4.56 20 7.92 20 12v6a2 2 0 0 1-2 2h-1v1a1 1 0 0 1-1.7.7L12.58 20H6a2 2 0 0 1-2-2v-6c0-4.08 3.17-7.44 7-7.93V3a1 1 0 0 1 1-1zm-4 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-6.5 5.5a.75.75 0 0 0 0 1.5h5a.75.75 0 0 0 0-1.5h-5z"/>
    </svg>
  </button>

  <div class="ai-chat-window" id="aiChatWindow">
    <div class="ai-chat-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:#fff;">
          <path d="M12 2a1 1 0 0 1 1 1v1.07C16.83 4.56 20 7.92 20 12v6a2 2 0 0 1-2 2h-1v1a1 1 0 0 1-1.7.7L12.58 20H6a2 2 0 0 1-2-2v-6c0-4.08 3.17-7.44 7-7.93V3a1 1 0 0 1 1-1zm-4 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-6.5 5.5a.75.75 0 0 0 0 1.5h5a.75.75 0 0 0 0-1.5h-5z"/>
        </svg>
        <span>Anima Clip Assistant</span>
      </div>
      <button class="ai-chat-close" id="aiChatClose">&times;</button>
    </div>
    <div class="ai-chat-messages" id="aiChatMessages">
      <div class="chat-bubble bot">
        Hi! I'm your Anima Clip Assistant. How can I help you with your animation project, tools, or layers today?
      </div>
    </div>
    <div class="ai-chat-footer">
      <input type="text" class="ai-chat-input" id="aiChatInput" placeholder="Ask about tools, layers, export..." maxlength="500">
      <button class="ai-chat-send" id="aiChatSend">Send</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const WORKER_AI_URL = "https://anima-clip-bot.hossainsarowar001.workers.dev";

    const firebaseConfig = {
      apiKey: "AIzaSyDzQo1HsYJwdcwOJFo2xd8P347PXgw3COE",
      authDomain: "anima-clip-support.firebaseapp.com",
      projectId: "anima-clip-support",
      storageBucket: "anima-clip-support.firebasestorage.app",
      messagingSenderId: "998194247470",
      appId: "1:998194247470:web:9bfb771ce9356dcf3d2597",
      measurementId: "G-7QKLY9KODR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const contactForm = document.getElementById('contactForm');
    const contactNotification = document.getElementById('contactNotification');
    const btnSubmit = document.getElementById('btnSubmitContact');

    function showNotification(msg) {
      contactNotification.innerText = msg;
      contactNotification.style.display = 'block';
      setTimeout(() => {
        contactNotification.style.display = 'none';
      }, 5000);
    }

    contactForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('contactEmail').value.trim();
      const message = document.getElementById('contactMessage').value.trim();

      if (!email || !message) return;

      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Sending...';

      try {
        await addDoc(collection(db, "contact_submissions"), {
          email,
          message,
          createdAt: serverTimestamp()
        });

        document.getElementById('contactEmail').value = '';
        document.getElementById('contactMessage').value = '';
        showNotification("✓ Message submitted successfully! The Incrible Studio team will review it.");
      } catch (err) {
        alert("Failed to submit message: " + err.message);
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Send Message';
      }
    };

    function cleanFormatting(str) {
      if (!str) return '';
      let clean = str;
      clean = clean.replace(/&lt;br\s*\/?&gt;/gi, '\n');
      clean = clean.replace(/<br\s*[\/]?>/gi, '\n');
      clean = clean.replace(/\*\*(.*?)\*\*/g, '$1');
      clean = clean.replace(/\*(.*?)\*/g, '$1');
      clean = clean.replace(/#{1,6}\s?/g, '');
      return clean.trim();
    }

    // Direct AI Assistant Logic
    const aiChatToggle = document.getElementById('aiChatToggle');
    const aiChatWindow = document.getElementById('aiChatWindow');
    const aiChatClose = document.getElementById('aiChatClose');
    const aiChatInput = document.getElementById('aiChatInput');
    const aiChatSend = document.getElementById('aiChatSend');
    const aiChatMessages = document.getElementById('aiChatMessages');

    aiChatToggle.onclick = () => {
      const isVisible = aiChatWindow.style.display === 'flex';
      aiChatWindow.style.display = isVisible ? 'none' : 'flex';
      if (!isVisible) aiChatInput.focus();
    };

    aiChatClose.onclick = () => {
      aiChatWindow.style.display = 'none';
    };

    async function sendDirectAiMessage() {
      const question = aiChatInput.value.trim();
      if (!question) return;

      const userBubble = document.createElement('div');
      userBubble.className = 'chat-bubble user';
      userBubble.textContent = question;
      aiChatMessages.appendChild(userBubble);
      aiChatInput.value = '';

      const loadingBubble = document.createElement('div');
      loadingBubble.className = 'chat-bubble loading';
      loadingBubble.textContent = 'Assistant is typing...';
      aiChatMessages.appendChild(loadingBubble);
      aiChatMessages.scrollTop = aiChatMessages.scrollHeight;

      try {
        const res = await fetch(WORKER_AI_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        
        loadingBubble.remove();
        const botBubble = document.createElement('div');
        botBubble.className = 'chat-bubble bot';
        botBubble.textContent = cleanFormatting(data.reply || "Sorry, I could not process your query right now.");
        aiChatMessages.appendChild(botBubble);
      } catch (err) {
        loadingBubble.remove();
        const errBubble = document.createElement('div');
        errBubble.className = 'chat-bubble bot';
        errBubble.textContent = "Connection issue. Please try again in a moment.";
        aiChatMessages.appendChild(errBubble);
      }

      aiChatMessages.scrollTop = aiChatMessages.scrollHeight;
    }

    aiChatSend.onclick = sendDirectAiMessage;
    aiChatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendDirectAiMessage();
    });
  </script>
</body>
</html>
