<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support | Anima Clip</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }
        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }
        .nav-links {
            text-align: center;
            margin-bottom: 25px;
        }
        .nav-links a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1rem;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        button:disabled {
            background-color: var(--border);
            cursor: not-allowed;
        }
        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 0.95rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Contact Support</h1>
        <p>Need help with Anima Clip? Send a direct message to our developer team.</p>
    </div>

    <div class="nav-links">
        <a href="community.html">← Visit Community Q&A Board</a>
    </div>

    <form id="contactForm" onsubmit="submitContactForm(event)">
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Developer / User Name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" placeholder="Describe your issue or feature request..." required></textarea>
        </div>

        <button type="submit" id="submitBtn">Send Message</button>
        <div id="statusMessage"></div>
    </form>
</div>

<script>
    // ACTIVE AUTHORIZED APPS SCRIPT ENDPOINT
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz9wElcmo2rtZp1IclXXmOdkl56t5DQQ4uMq3DlLboxQ7nWtwI70NZt_MZXZC0Yzluz1A/exec';

    function submitContactForm(event) {
        event.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const message = document.getElementById('message').value.trim();
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMessage');

        submitBtn.innerText = "Sending...";
        submitBtn.disabled = true;
        statusMsg.style.display = "none";

        const payload = {
            action: "contact",
            name: name,
            email: email,
            message: message
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            }
        })
        .then(response => response.text())
        .then(data => {
            if (data === "SENT" || data === "OK") {
                statusMsg.style.color = "var(--success)";
                statusMsg.innerText = "Message sent successfully! We will get back to you shortly.";
                statusMsg.style.display = "block";
                document.getElementById('contactForm').reset();
            } else {
                statusMsg.style.color = "var(--danger)";
                statusMsg.innerText = "Error delivering message. Please try again later.";
                statusMsg.style.display = "block";
            }
            submitBtn.innerText = "Send Message";
            submitBtn.disabled = false;
        })
        .catch(error => {
            statusMsg.style.color = "var(--danger)";
            statusMsg.innerText = "Network error. Please check your connection.";
            statusMsg.style.display = "block";
            submitBtn.innerText = "Send Message";
            submitBtn.disabled = false;
        });
    }
</script>

</body>
</html>
